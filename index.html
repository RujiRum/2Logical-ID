<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#082f3c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="2logical ID">
<link rel="apple-touch-icon" href="./assets/icon-180.png?v=9">
<link rel="manifest" href="./manifest.webmanifest?v=9">
<title>2logical ID</title>
<style>
:root{--deep:#04181f;--teal:#0f4959;--lime:#8dc63f;--white:#fff;--muted:#b7c4c8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:var(--deep);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#fff}
body{min-height:100svh;overflow-x:hidden}
.app{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% -10%,rgba(141,198,63,.13),transparent 36%),linear-gradient(#0b3440,#04181f 60%)}
.top{width:min(100%,520px);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand img{width:44px;height:44px;border-radius:11px;background:#fff;object-fit:cover}.brand h1{font-size:20px;line-height:1;margin:0}.brand p{font-size:12px;color:var(--muted);margin:5px 0 0}.pill{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--lime);border:1px solid rgba(141,198,63,.45);background:rgba(141,198,63,.08);border-radius:999px;padding:8px 10px;white-space:nowrap}
.stage{width:min(100%,520px);flex:1;display:grid;place-items:center;padding:4px 0 12px}.wrap{width:min(88vw,390px);aspect-ratio:2/3;perspective:1400px;cursor:pointer}.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.75,.25,1)}.card.flip{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 22px 54px rgba(0,0,0,.46);backface-visibility:hidden;-webkit-backface-visibility:hidden}.face.back{transform:rotateY(180deg)}.face img{width:100%;height:100%;display:block;object-fit:cover}.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;background:rgba(3,22,29,.76);padding:7px 12px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;pointer-events:none;backdrop-filter:blur(10px)}
.controls{width:min(100%,520px);display:grid;grid-template-columns:1fr 1fr;gap:10px}.controls button{min-height:50px;border:0;border-radius:15px;font:inherit;font-weight:800;font-size:16px}.primary{background:var(--lime);color:#082f3c}.secondary{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.12)!important}.controls button:active{transform:scale(.985)}.foot{font-size:10px;color:var(--muted);padding-top:10px;text-align:center}
@media(max-height:760px){.wrap{width:min(70vw,320px)}.stage{padding:0 0 7px}.foot{display:none}.top{padding-bottom:6px}}
@media(max-width:380px){.pill{display:none}.wrap{width:min(86vw,360px)}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand"><img src="./assets/icon-180.png?v=9" alt="2logical"><div><h1>2logical ID</h1><p>Justin Phillips · Consultant</p></div></div><div class="pill">OFFLINE READY</div></header>
<section class="stage"><div class="wrap" id="wrap" role="button" tabindex="0" aria-label="Flip employee badge"><div class="card" id="card"><div class="face"><img src="./assets/badge-front.png?v=9" alt="Front of employee badge"></div><div class="face back"><img src="./assets/badge-back.png?v=9" alt="Back of employee badge"></div></div><div class="hint">Tap card to flip</div></div></section>
<section class="controls"><button class="primary" id="flip">Show Back</button><button class="secondary" id="full">Full Screen</button></section>
<div class="foot">2logical ID · v9</div>
</main>
<script>
const card=document.getElementById('card'),wrap=document.getElementById('wrap'),flip=document.getElementById('flip'),full=document.getElementById('full');let back=false;
function toggle(){back=!back;card.classList.toggle('flip',back);flip.textContent=back?'Show Front':'Show Back'}
wrap.addEventListener('click',toggle);flip.addEventListener('click',toggle);wrap.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
full.addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){window.scrollTo(0,0)}});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js?v=9').catch(()=>{}));
</script>
</body></html>
